<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #111827; }
    header { background: #1d4ed8; color: #fff; padding: 16px 24px; }
    main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card h3 { margin: 0; font-size: 14px; color: #6b7280; }
    .card p { margin: 6px 0 0; font-size: 24px; font-weight: bold; }
    form, .table-wrap { background: #fff; padding: 16px; border-radius: 10px; margin-top: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    input { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: 10px; border: 0; border-radius: 6px; cursor: pointer; color: #fff; background: #1d4ed8; }
    button.edit { background: #f59e0b; } button.del { background: #dc2626; } button.cancel { background: #6b7280; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }
    .table-wrap { overflow-x: auto; }
    td button { padding: 6px 10px; margin-right: 4px; }
    .low { color: #dc2626; font-weight: bold; }
  </style>
</head>
<body>
  <header><h1>Inventory Dashboard</h1></header>
  <main>
    <section class="cards">
      <div class="card"><h3>Total Items</h3><p id="totalItems">0</p></div>
      <div class="card"><h3>Total Value</h3><p id="totalValue">₱0.00</p></div>
      <div class="card"><h3>Low Stock (≤5)</h3><p id="lowStock">0</p></div>
    </section>

    <form id="itemForm">
      <input type="hidden" id="itemId" />
      <input id="name" placeholder="Item name" required />
      <input id="category" placeholder="Category" required />
      <input id="price" type="number" step="0.01" min="0" placeholder="Price" required />
      <input id="quantity" type="number" min="0" placeholder="Quantity" required />
      <button type="submit" id="saveBtn">Add Item</button>
      <button type="button" class="cancel" id="cancelBtn" style="display:none">Cancel</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Qty</th><th>Actions</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const form = $("itemForm");

    async function loadStats() {
      const s = await (await fetch("/api/stats")).json();
      $("totalItems").textContent = s.totalItems;
      $("totalValue").textContent = "₱" + s.totalValue.toFixed(2);
      $("lowStock").textContent = s.lowStock;
    }

    async function loadItems() {
      const items = await (await fetch("/api/items")).json();
      $("tableBody").innerHTML = items.map(i => `
        <tr>
          <td>${i.id}</td>
          <td>${i.name}</td>
          <td>${i.category}</td>
          <td>₱${i.price.toFixed(2)}</td>
          <td class="${i.quantity <= 5 ? "low" : ""}">${i.quantity}</td>
          <td>
            <button class="edit" onclick='editItem(${JSON.stringify(i)})'>Edit</button>
            <button class="del" onclick="deleteItem(${i.id})">Delete</button>
          </td>
        </tr>`).join("");
      loadStats();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        name: $("name").value.trim(),
        category: $("category").value.trim(),
        price: parseFloat($("price").value),
        quantity: parseInt($("quantity").value),
      };
      const id = $("itemId").value;
      await fetch(id ? `/api/items/${id}` : "/api/items", {
        method: id ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      resetForm();
      loadItems();
    });

    function editItem(i) {
      $("itemId").value = i.id;
      $("name").value = i.name;
      $("category").value = i.category;
      $("price").value = i.price;
      $("quantity").value = i.quantity;
      $("saveBtn").textContent = "Update Item";
      $("cancelBtn").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteItem(id) {
      if (!confirm("Delete this item?")) return;
      await fetch(`/api/items/${id}`, { method: "DELETE" });
      loadItems();
    }

    function resetForm() {
      form.reset();
      $("itemId").value = "";
      $("saveBtn").textContent = "Add Item";
      $("cancelBtn").style.display = "none";
    }
    $("cancelBtn").addEventListener("click", resetForm);

    loadItems();
  </script>
</body>
</html>
